[build-system]
requires = ["setuptools>=62.3"]      # `**` in package-data globs needs 62.3
build-backend = "setuptools.build_meta"

[project]
name = "segmently-modules"
version = "0.4.0.dev0"
description = "Code-structure-centric context layer for AI coding agents"
requires-python = ">=3.9"
dependencies = []

[project.urls]
Homepage = "https://github.com/segmently-ai/segmently-modules"

[project.scripts]
segmently-modules = "segmently_modules.cli:main"

[tool.setuptools.packages.find]
include = ["segmently_modules*"]

[tool.setuptools.package-data]
segmently_modules = ["_vendor/tomli/LICENSE",
                     "defaults/*.toml", "defaults/templates/*.md", "defaults/templates/roles/*.md",
                     "defaults/templates/init/*.md",
                     "defaults/templates/choose/*.md", "defaults/agents/*.md",
                     "defaults/scaffold/*", "defaults/packs/**/*"]
