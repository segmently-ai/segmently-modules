[build-system]
requires = ["setuptools>=62.3"]      # `**` in package-data globs needs 62.3
build-backend = "setuptools.build_meta"

[project]
name = "modsys"
version = "0.1.2"
description = "Code-structure-centric context layer for AI coding agents"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
modsys = "modsys.cli:main"

[tool.setuptools.packages.find]
include = ["modsys*"]

[tool.setuptools.package-data]
modsys = ["defaults/*.toml", "defaults/templates/*.md", "defaults/templates/roles/*.md",
          "defaults/templates/init/*.md",
          "defaults/templates/choose/*.md", "defaults/agents/*.md",
          "defaults/scaffold/*", "defaults/packs/**/*"]
